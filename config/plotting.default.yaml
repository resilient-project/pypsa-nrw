# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#plotting
plotting:
  map:
    boundaries: [-11, 30, 34, 71]
    geomap_colors:
      ocean: white
      land: white
  projection:
    name: "EqualEarth"
    # See https://scitools.org.uk/cartopy/docs/latest/reference/projections.html for alternatives, for example:
    # name: "LambertConformal"
    # central_longitude: 10.
    # central_latitude: 50.
    # standard_parallels: [35, 65]
  eu_node_location:
    x: -5.5
    y: 46.
  costs_max: 1000
  costs_threshold: 0.5
  energy_max: 20000
  energy_min: -20000
  energy_threshold: 50.
  balance_timeseries:
    max_threshold: 5 # GW
    mean_threshold: 1 # GW
    monthly: true
    monthly_resolution:
    annual: true
    annual_resolution: D
    carriers:
    - H2
    - NH3
    - gas
    - methanol
    - oil
    - solid biomass
    - biogas
    - co2 stored
    - co2
    carrier_groups:
      electricity:
      - AC
      - low voltage
      heat:
      - urban central heat
      - urban decentral heat
      - rural heat
      - residential urban decentral heat
      - residential rural heat
      - services urban decentral heat
      - services rural heat
  heatmap_timeseries:
    marginal_price:
    - AC
    - H2
    - NH3
    - gas
    - methanol
    - oil
    - co2 stored
    - urban central heat
    utilisation_rate:
    - solar
    - solar rooftop
    - solar-hsat
    - onwind
    - offwind-dc
    - offwind-ac
    - offwind-float
    - ror
    - hydro
    - PHS
    - battery charger
    - battery discharger
    - H2 Electrolysis
    - Fischer-Tropsch
    - methanolisation
    - Sabatier
    - OCGT
    - H2 Fuel Cell
    - urban central CHP
    - urban central CHP CC
    - urban central solid biomass CHP
    - urban central solid biomass CHP CC
    - rural gas boiler
    - urban central air heat pump
    - DAC
    soc:
    - battery
    - H2 Store
    - co2 stored
    - gas
    - methanol
    - oil
    - urban central water tanks
  balance_map:
    bus_carriers:
    - AC
    - H2
    - co2_stored
    AC:
      unit: TWh
      unit_conversion: 1_000_000
      cmap: Greens
      vmin:
      vmax:
      region_unit: €/MWh
      bus_factor: 0.002
      branch_factor: 0.01
      flow_factor: 100
      bus_sizes:
      - 200
      - 100
      branch_sizes:
      - 100
      - 20
    gas:
      unit: TWh
      unit_conversion: 1_000_000
      cmap: Purples
      vmin:
      vmax:
      region_unit: €/MWh
      bus_factor: 0.002
      branch_factor: 0.05
      flow_factor: 60
      bus_sizes:
      - 200
      - 100
      branch_sizes:
      - 100
      - 50
    H2:
      unit: TWh
      unit_conversion: 1_000_000
      cmap: Blues
      vmin:
      vmax:
      region_unit: €/MWh
      bus_factor: 0.002
      branch_factor: 0.07
      flow_factor: 50
      bus_sizes:
      - 50
      - 25
      branch_sizes:
      - 40
      - 20
    co2 stored:
      unit: Mt
      unit_conversion: 1_000_000
      cmap: Purples
      vmin:
      vmax:
      region_unit: €/t_${CO_2}$
      bus_factor: 0.03
      branch_factor: 0.02
      flow_factor: 25
      bus_sizes:
      - 50
      - 10
      branch_sizes:
      - 5
      - 2
    urban central heat:
      unit: TWh
      unit_conversion: 1_000_000
      cmap: Oranges
      vmin:
      vmax:
      region_unit: €/MWh
      bus_factor: 0.005
      branch_factor: 0.1
      flow_factor: 100
      bus_sizes:
      - 300
      - 100
      branch_sizes:
    methanol:
      unit: TWh
      unit_conversion: 1_000_000
      cmap: Greens
      vmin:
      vmax:
      region_unit: €/MWh
      bus_factor: 0.005
      branch_factor: 0.1
      flow_factor: 100
      bus_sizes:
      - 20
      - 10
      branch_sizes:
    biogas:
      unit: TWh
      unit_conversion: 1_000_000
      cmap: Greens
      vmin:
      vmax:
      region_unit: €/MWh
      bus_factor: 0.1
      branch_factor: 0.1
      flow_factor: 100
      bus_sizes:
      - 100
      - 50
      branch_sizes:
    solid biomass:
      unit: TWh
      unit_conversion: 1_000_000
      cmap: Greens
      vmin:
      vmax:
      region_unit: €/MWh
      bus_factor: 0.01
      branch_factor: 0.1
      flow_factor: 100
      bus_sizes:
      - 100
      - 50
      branch_sizes:
    oil:
      unit: TWh
      unit_conversion: 1_000_000
      cmap: Greys
      vmin:
      vmax:
      region_unit: €/MWh
      bus_factor: 0.002
      branch_factor: 0.01
      flow_factor: 100
      bus_sizes:
      - 200
      - 100
      branch_sizes:

  interactive_map:
    enable: true
    bus_carriers:
    - AC
    - co2_stored # underscore only needed for slurm environment
    - H2
    AC:
      conversion: 1_000_000 # division
      region_cmap: Greens
      region_alpha: 0.8
      region_unit: €/MWh
      region_vmin: 30
      region_vmax: 100
      branch_color: darkseagreen
      arrow_size_factor: 2
      bus_size_max: 15000
      branch_width_max: 20
      map_style: road
      tooltip: true
    H2:
      conversion: 1_000_000 # division
      region_cmap: Blues
      region_alpha: 0.8
      region_unit: €/MWh
      region_vmin: 0
      region_vmax: 120
      branch_color: pink
      arrow_size_factor: 2
      bus_size_max: 20000
      branch_width_max: 45
      map_style: road
      tooltip: true
    co2_stored:
      conversion: 1_000_000 # division
      region_cmap: Purples
      region_alpha: 0.8
      region_unit: €/t CO2
      region_vmin: 0
      region_vmax: 150
      branch_color: orange
      arrow_size_factor: 2
      bus_size_max: 15000
      branch_width_max: 7
      map_style: road
      tooltip: true
